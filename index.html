<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivento Design Manuals</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f7f3ed;
color:#3d3127;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:60px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
max-width:700px;
width:90%;
text-align:center;
}

h1{
font-size:42px;
margin-bottom:10px;
font-family:Georgia,serif;
}
  
.logo{
    width:220px;
    max-width:80%;
    margin-bottom:25px;
  
}
.subtitle{
font-size:18px;
color:#777;
margin-bottom:45px;
}

.buttons{
display:flex;
flex-direction:column;
gap:15px;
}

a{
text-decoration:none;
padding:18px;
border-radius:12px;
background:#b39b82;
color:white;
font-size:20px;
font-weight:600;
transition:.25s;
}

a:hover{
background:#8f745a;
transform:translateY(-2px);
}

.footer{
margin-top:45px;
font-size:14px;
color:#888;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.jpeg" alt="Vivento Design" class="logo">

<div class="subtitle">
Select your language<br>
Wybierz język · Sprache wählen · Choisissez votre langue
</div>

<div class="buttons">

<a href="German.pdf" target="_blank">🇩🇪 Deutsch</a>

<a href="Francais.pdf" target="_blank">🇫🇷 Français</a>

<a href="Espagnol.pdf" target="_blank">🇪🇸 Español</a>

<a href="Polonais.pdf" target="_blank">🇵🇱 Polski</a>

<a href="Slovaque.pdf" target="_blank">🇸🇰 Slovenčina</a>

</div>

<div class="footer">

Vivento Design<br><br>

Handcrafted Wooden Lighting<br>
Made in Austria

</div>

</div>

</body>
</html>
