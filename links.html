<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivento Design</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0e8;
            color: #222;
            text-align: center;
        }

        .page {
            max-width: 420px;
            margin: 0 auto;
            padding: 50px 24px;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 36px;
            color: #666;
        }

        .link-button {
            display: block;
            padding: 16px;
            margin: 14px 0;
            border: 1px solid #222;
            color: #222;
            text-decoration: none;
            border-radius: 4px;
            background: white;
        }

        .link-button:hover {
            background: #222;
            color: white;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>
    <main class="page">

        <img src="logo.jpeg" alt="Vivento Design logo" class="logo">

        <h1>VIVENTO DESIGN</h1>

        <p class="subtitle">
            Wooden lighting made in Austria
        </p>

        <a class="link-button" href="#">
            Shop on Etsy
        </a>

        <a class="link-button" href="#">
            Instagram
        </a>

        <a class="link-button" href="#">
            Pinterest
        </a>

        <a class="link-button" href="index.html">
            Installation Manuals
        </a>

        <a class="link-button" href="mailto:contact@in-vente.eu">
            Contact
        </a>

        <footer>
            © Vivento Design
        </footer>

    </main>
</body>
</html>
